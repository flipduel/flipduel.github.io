<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 92" role="img" aria-label="Flip Duel">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#041018" flood-opacity=".85"/>
    </filter>
  </defs>
  <g filter="url(#s)" font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="110" y="42" font-size="42" fill="#2ee0ff" stroke="#07324a" stroke-width="6" paint-order="stroke">FLIP</text>
    <text x="110" y="80" font-size="38" fill="#ffd23a" stroke="#7a4a00" stroke-width="6" paint-order="stroke">DUEL</text>
  </g>
</svg>
